openapi: "3.0.1"
info:
  title: Product service API
  description: API to managment products of bank
  version: 1.0.0
servers:
  - url: http://localhost:8383
    description: local server
paths:
  /api/products:
    get:
      summary: Getting products.
      operationId: findAll
      responses:
        '200':
          description: Success find all products
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ProductResponse"
    post:
      summary: Create new product of bank.
      operationId: createProduct
      requestBody:
        description: Details to create new product of bank.
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProductRequest"
      responses:
        '200':
          description: Success create
          content:
            application/json:
              schema:
                type: string
  /api/products/{productId}:
    get:
      summary: Getting product by id
      operationId: getProductById
      parameters:
        - name: productId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductResponse"
        '404':
          description: Product not found
    put:
      summary: Updated product
      operationId: udpate
      parameters:
        - name: productId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        description: Details to updated product.
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProductUpdateRQ'
      responses:
        '200':
          description: Success updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductResponse'
        '404':
          description: Product not found to updated

    delete:
      summary: delete product
      operationId: delete
      parameters:
        - name: productId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Successful deleted
        '404':
          description: Product not found to delete

  /api/products/customer/{customerId}:
    get:
      summary: Updated product
      operationId: getProductsByCustomerId
      parameters:
        - name: customerId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Success find all products by customerId
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ProductResponse"

  /api/products/{productId}/holders:
    get:
      summary: Gettting holders by productId
      operationId: getHolderByProductId
      parameters:
        - name: productId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AdditionalPersonBean"
        '404':
          description: Product not found
    put:
      summary: Update holders by productId
      operationId: updateHolderByProductId
      parameters:
        - name: productId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        description: Details to updated product.
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdditionalPersonBean"
      responses:
        '200':
          description: Success updated
          content:
            application/json:
              schema:
                type: boolean
        '404':
          description: Product not found to updated

  /api/products/{productId}/auths:
    get:
      summary: Gettting holders by productId
      operationId: getSignaturesAuthByProductId
      parameters:
        - name: productId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AdditionalPersonBean"
        '404':
          description: Product not found
    put:
      summary: Update holders by productId
      operationId: updateSignaturesAuthByProductId
      parameters:
        - name: productId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        description: Details to updated product.
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdditionalPersonBean"
      responses:
        '200':
          description: Success updated
          content:
            application/json:
              schema:
                type: boolean
        '404':
          description: Product not found to updated
  /api/products/{productId}/balance:
    get:
      summary: Getting balance of product with product by id
      operationId: getProductBalance
      parameters:
        - name: productId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BalanceBeanResponse"
        '404':
          description: Product not found
    put:
      summary: Updated balance
      operationId: udpateBalance
      parameters:
        - name: productId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        description: Details to updated product.
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BalanceBeanRequest'
      responses:
        '200':
          description: Success updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BalanceBeanResponse'
        '404':
          description: Product not found to updated
  /api/products/account/{accountNumber}:
    get:
      summary: Getting passive product by accountNumber
      operationId: getProductByAccountNumber
      parameters:
        - name: accountNumber
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductResponse"
        '404':
          description: Product not found
  /api/products/types:
    post:
      summary: Create new type of product
      operationId: createProductType
      requestBody:
        description: Create a new product type
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProductTypeRequest"
      responses:
        '200':
          description: Success create
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductTypeResponse"
  /api/products/types/{codeType}:
    get:
      summary: Getting product type by code
      operationId: getProducTypeByCode
      parameters:
        - name: codeType
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductTypeResponse"
        '404':
          description: Product type not found

  /api/products/cards/{cardId}:
    get:
      summary: Getting card number by numbercard
      operationId: getCardById
      parameters:
        - name: cardId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: plastic card
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlasticCardBean'

components:
  schemas:
    ProductRequest:
      type: object
      properties:
        productType:
          type: string
        userBank:
          type: string
        amountOfOpen:
          type: number
          format: double
        customer:
          $ref: "#/components/schemas/CustomerBean"
        holders:
          type: array
          description: List of holders associated with this product
          items:
            $ref: '#/components/schemas/AdditionalPersonBean'
        authorizedSignatories:
          type: array
          description: List of signatories authorized associated with this product
          items:
            $ref: '#/components/schemas/AdditionalPersonBean'
    ProductResponse:
      type: object
      properties:
        id:
          type: string
          description: unique ID
        productType:
          type: string
        amountOfOpen:
          type: number
          format: double
        accountNumber:
          type: string
        hasPlasticCard:
          type: boolean
        cardNumber:
          type: string
        createdDate:
          type: string
          format: date
        customer:
          $ref: "#/components/schemas/CustomerBean"
        holders:
          type: array
          description: List of holders associated with this product
          items:
            $ref: '#/components/schemas/AdditionalPersonBean'
        authorizedSignatories:
          type: array
          description: List of signatories authorized associated with this product
          items:
            $ref: '#/components/schemas/AdditionalPersonBean'
    ActiveProductBean:
      type: object
      properties:
        hasCreditCard:
          type: boolean
        creditLimit:
          type: number
          format: double
        creditBalance:
          type: number
          format: double
        creditLimitUsed:
          type: number
          format: double


    PassiveProductBean:
      type: object
      properties:
        amountOfOpen:
          type: number
          format: double
        accountNumber:
          type: string

    AdditionalPersonBean:
      type: object
      properties:
        fullName:
          type: string
        email:
          type: string
        phone:
          type: string
        identification:
          $ref: "#/components/schemas/IdentificationBean"

    CustomerBean:
      type: object
      properties:
        customerId:
          type: string
        customerType:
          type: string
    IdentificationBean:
      type: object
      properties:
        typeIdentification:
          type: string
        numberIdentification:
          type: string
    InfoTransactionBean:
      type: object
      properties:
        commission:
          type: number
          format: double
        maxPerMonth:
          type: string
        transactionDone:
          type: string
        enabledToMovement:
          type: boolean

    ProductUpdateRQ:
      type: object
      properties:
        actionToUpdate:
          type: string
        statusProduct:
          type: string
        hasPlasticCard:
          type: boolean
        plasticCardId:
          type: string
        holders:
          type: array
          description: List of holders associated with this product
          items:
            $ref: '#/components/schemas/AdditionalPersonBean'
        authorizedSignatories:
          type: array
          description: List of signatories authorized associated with this product
          items:
            $ref: '#/components/schemas/AdditionalPersonBean'

    BalanceBeanResponse:
      type: object
      properties:
        creditLimit:
          type: number
          format: double
          description: credit limit of active product
        creditLimitUsed:
          type: number
          format: double
          description: credit used of credit card
        creditEnabledToUse:
          type: number
          format: double
          description: amount enabled of credit card
        totalAmountInAccount:
          type: number
          format: double
          description: total amount of passive product, accounts
    BalanceBeanRequest:
      type: object
      properties:
        amount:
          type: number
          format: double
          description: amount in account on time of passive product
        movementType:
          type: string
          description: type of movement DEPOSIT , WITHDRAW
    ProductTypeRequest:
      type: object
      properties:
        code:
          type: string
          description: code to new product
        description:
          type: string
          description: description of this product
        familyType:
          type: string
          description: family type ACTIVE or PASSIVE
        isFreeMaintenanceCommission:
          type: boolean
          description: true if is free to apply commission per maintenance
        isFreeNumberMovement:
          type: boolean
          description: true if free number of movement per months
        isFreeCommissionPerMovement:
          type: boolean
          description: true if free of commission movement
        maxMovementPerMonth:
          type: number
          format: int64
          description: indicate maxime movement per month
        dateToUniqueMovement:
          type: string
          description: indicate date when permit only one movement per month
        maintenanceCommission:
          type: number
          format: double
          description: indicate commission amount of maintenance
        movementCommission:
          type: number
          format: double
          description: indicate commision amount for movement
    ProductTypeResponse:
      type: object
      properties:
        code:
          type: string
          description: code to new product
        description:
          type: string
          description: description of this product
        familyType:
          type: string
          description: family type ACTIVE or PASSIVE
        isFreeMaintenanceCommission:
          type: boolean
          description: true if is free to apply commission per maintenance
        isFreeNumberMovement:
          type: boolean
          description: true if free number of movement per months
        isFreeCommissionPerMovement:
          type: boolean
          description: true if free of commission movement
        maxMovementPerMonth:
          type: number
          format: int64
          description: indicate maxime movement per month
        dateToUniqueMovement:
          type: string
          description: indicate date when permit only one movement per month
        maintenanceCommission:
          type: number
          format: double
          description: indicate commission amount of maintenance
        movementCommission:
          type: number
          format: double
          description: indicate commision amount for movement
    PlasticCardBean:
      type: object
      properties:
        id:
          type: string
          description: plastic card id
        productIdAssociated:
          type: string
        cardType:
          type: string
          description: DEBIT or CREDIT
        expirationDate:
          type: string
        cardNumber:
          type: string


