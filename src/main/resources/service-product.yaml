openapi: "3.0.1"
info:
  title: Customer service API
  description: API to managment products of bank
  version: 1.0.0
servers:
  - url: http://localhost:8383
    description: local server
paths:
  /api/products:
    post:
      summary: Create new product of bank.
      operationId: createProduct
      requestBody:
        description: Details to create new product of bank.
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProductRequest"
      responses:
        '200':
          description: Success create
          content:
            application/json:
              schema:
                type: string
components:
  schemas:
    ProductRequest:
      type: object
      properties:
        id:
          type: string
          description: unique ID
        customerId:
          type: string
          description: Customer Id
        customerType:
          type: string
        productType:
          type: string
          description: type of product
        userBank:
          type: string
          description: username of bank who is managmenting this product
        holders:
          type: array
          description: List of holders
          items:
            $ref: '#/components/schemas/PersonalInformationAddBean'
        authorizedSignatories:
          type: array
          description: List of signatures auth
          items:
            $ref: '#/components/schemas/PersonalInformationAddBean'

    ProductResponse:
      type: object
      properties:
        id:
          type: string
          description: unique ID
        customerId:
          type: string
          description: Customer Id
        productType:
          type: string
          description: type of product
        numberProduct:
          type: string
          description: numeration of  products
        freeComission:
          type: boolean
          description: indicate if this product have comission or not
        comission:
          type: string
          description: indicate comission amount fer movement
        activeProducts:
          type: array
          description: List of active products associated with this product
          items:
            $ref: "#/components/schemas/ActiveProductBean"
        passiveProducts:
          type: array
          description: List of passive products associated with this product
          items:
            $ref: "#/components/schemas/PassiveProductBean"



    ActiveProductBean:
      type: object
      properties:
        id:
          type:  string
          description: active product's id
        accountNumber:
          type: string
        status:
          type: string
        hasCreditCard:
          type: boolean
        creditLimit:
          type: number
          format: double
        creditLimitEnabled:
          type: number
          format: double
        creditLimitUsed:
          type: number
          format: double
        productType:
          type: string
        createdDate:
          type: string
          format: date-time
        holders:
          type: array
          description: List of holders associated with this product
          items:
            $ref: '#/components/schemas/PersonalInformationAddBean'
        authorizedSignatories:
          type: array
          description: List of signatories authorized associated with this product
          items:
            $ref: '#/components/schemas/PersonalInformationAddBean'

    PassiveProductBean:
      type: object
      properties:
        id:
          type:  string
          description: active product's id
        accountNumber:
          type: string
        status:
          type: string
        commissionMovement:
          type: number
          format: double
        isFreeCommission:
          type: boolean
        maxMovementPerMonth:
          type: integer
          format: int64
        productType:
          type: string
        createdDate:
          type: string
          format: date-time
        holders:
          type: array
          description: List of holders associated with this product
          items:
            $ref: '#/components/schemas/PersonalInformationAddBean'
        authorizedSignatories:
          type: array
          description: List of signatories authorized associated with this product
          items:
            $ref: '#/components/schemas/PersonalInformationAddBean'

    PersonalInformationAddBean:
      type: object
      properties:
        name:
          type: string
        lastName:
          type: string
        identification:
          type: string
        typeIdentification:
          type: string
        email:
          type: string
        phone:
          type: string
